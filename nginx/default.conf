server {
    listen 80;
    server_name pickme.mov;

    # TLS is terminated by Cloudflare; origin is HTTP behind cloudflared tunnel.

    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # /api/v1/chat стрімить SSE. Без цього nginx збирає токени у власний
        # буфер і віддає їх одним шматком — стрім ніби є, а виглядає як зависання.
        # Локальна модель думає 10-15 секунд до першого видимого токена.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://app:3000;
    }

    # MCP endpoint for AI clients. Buffering is off and the read timeout is
    # generous because a tool call may hold the connection while it queries.
    location /mcp {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
