services:
  app:
    image: pickme-app-base
    container_name: pickme-app
    command: ["./scripts/docker-entrypoint.sh"]
    expose:
      - "3000"
    volumes:
      - ./server/dist:/app/server/dist:ro
      - ./server/drizzle:/app/server/drizzle:ro
      - ./db/seed-data:/app/db/seed-data:ro
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://pickme:${DB_PASSWORD}@postgres:5432/pickme
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DEFAULT_LOCALE=uk
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pickme-db
    environment:
      - POSTGRES_DB=pickme
      - POSTGRES_USER=pickme
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickme"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pickme-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: pickme-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  pgdata:
    driver: local
  certbot-webroot:
    driver: local
  certbot-certs:
    driver: local
