services:
  app:
    image: pickme-app-base
    container_name: pickme-app
    command: ["./scripts/docker-entrypoint.sh"]
    expose:
      - "3000"
    volumes:
      - ./server/dist:/app/server/dist:ro
      - ./server/drizzle:/app/server/drizzle:ro
      - ./db/seed-data:/app/db/seed-data:ro
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://pickme:${DB_PASSWORD}@postgres:5432/pickme
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DEFAULT_LOCALE=uk
      - BOT_URL=http://bot:3002
      - MCP_INTERNAL_URL=http://app:3000/mcp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Ізольований контейнер для чат-бота. Тримає лише доступ до LLM: ані
  # DATABASE_URL, ані JWT_SECRET, ані OAuth сюди не потрапляють. До каталогу
  # ходить виключно через MCP з ключем, який app карбує на одну розмову, тож
  # максимум, до чого дотягнеться промпт-інжекція — тули одного користувача.
  bot:
    image: pickme-app-base
    container_name: pickme-bot
    working_dir: /app/bot
    command: ["node", "dist/server.js"]
    expose:
      - "3002"
    volumes:
      - ./bot/dist:/app/bot/dist:ro
    environment:
      - NODE_ENV=production
      - PORT=3002
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL:-qwen3.6-35b-224k-moe}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET}
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pickme-db
    environment:
      - POSTGRES_DB=pickme
      - POSTGRES_USER=pickme
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickme"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pickme-nginx
    # Origin is reachable only from localhost; cloudflared publishes it.
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
